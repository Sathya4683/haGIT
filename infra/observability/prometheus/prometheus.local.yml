# Local development: scrapes the Next.js dev server running on the host.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: local

scrape_configs:
  - job_name: hagit-app
    metrics_path: /api/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /prometheus/metrics_token
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: hagit-web

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:3000/auth/login
          - http://host.docker.internal:3000/kb
          - http://ntfy/v1/health
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets:
          - http://host.docker.internal:3000/api/health
    relabel_configs: *blackbox_relabel

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
