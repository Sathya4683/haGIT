# Production: scrapes the Vercel deployment over HTTPS and probes public endpoints.
global:
  scrape_interval: 60s
  evaluation_interval: 60s
  external_labels:
    env: production

scrape_configs:
  - job_name: hagit-app
    metrics_path: /api/metrics
    scheme: https
    scrape_interval: 120s
    scrape_timeout: 20s
    authorization:
      type: Bearer
      credentials_file: /prometheus/metrics_token
    static_configs:
      - targets: ["hagithub.vercel.app"]
        labels:
          service: hagit-web

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://hagithub.vercel.app/auth/login
          - https://hagithub.vercel.app/kb
          - https://hagithub-admin.vercel.app/login
          - https://ntfy.sh/v1/health
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets:
          - https://hagithub.vercel.app/api/health
    relabel_configs: *blackbox_relabel

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
