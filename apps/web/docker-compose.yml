name: hagit-rate-limit

services:
  hagit-rate-limit-redis:
    image: redis:7-alpine
    container_name: hagit-rate-limit-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - hagit_rate_limit_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hagit_rate_limit_redis_data:
